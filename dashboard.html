<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لوحة التحكم - SaaS تجريبي</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">لوحة تحكم - SaaS تجريبي</a>
      <div class="d-flex">
        <a id="btnBack" class="btn btn-outline-light me-2" href="index.html">الخريطة</a>
        <button id="btnLogout" class="btn btn-light">تسجيل الخروج</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h4 class="mb-0">مشاريعك</h4>
        <small id="userBadge" class="text-muted"></small>
      </div>

      <div class="d-flex gap-2">
        <input id="searchInput" class="form-control form-control-sm" placeholder="ابحث برمز أو اسم أو معدات" style="min-width:220px;">
        <select id="statusFilter" class="form-select form-select-sm">
          <option value="all">كل الحالات</option>
          <option value="active">جاري</option>
          <option value="planned">مخطط</option>
          <option value="completed">مكتمل</option>
        </select>
        <button id="btnNew" class="btn btn-success btn-sm">إضافة مشروع جديد</button>
      </div>
    </div>

    <div id="projectsTableContainer" class="table-responsive mb-3"></div>

    <nav>
      <ul id="pagination" class="pagination justify-content-center"></ul>
    </nav>

    <!-- Modals -->
    <div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <form id="projectForm" class="needs-validation" novalidate>
            <div class="modal-header">
              <h5 class="modal-title" id="projectModalTitle">مشروع جديد</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="projId" />
              <div class="row g-2">
                <div class="col-md-6">
                  <label class="form-label">الرمز (ID)</label>
                  <input id="projCode" class="form-control" required />
                  <div class="invalid-feedback">الرمز مطلوب</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">اسم المشروع</label>
                  <input id="projName" class="form-control" required />
                  <div class="invalid-feedback">الاسم مطلوب</div>
                </div>
                <div class="col-md-4">
                  <label class="form-label">خط العرض (lat)</label>
                  <input id="projLat" class="form-control" required pattern="^-?[0-9]+(\.[0-9]+)?$" />
                  <div class="invalid-feedback">اِدخل قيمة صحيحة لإحداثي lat</div>
                </div>
                <div class="col-md-4">
                  <label class="form-label">خط الطول (lng)</label>
                  <input id="projLng" class="form-control" required pattern="^-?[0-9]+(\.[0-9]+)?$" />
                  <div class="invalid-feedback">اِدخل قيمة صحيحة لإحداثي lng</div>
                </div>
                <div class="col-md-4">
                  <label class="form-label">الحالة</label>
                  <select id="projStatus" class="form-select">
                    <option value="active">جاري</option>
                    <option value="planned">مخطط</option>
                    <option value="completed">مكتمل</option>
                  </select>
                </div>
                <div class="col-12">
                  <label class="form-label">المعدات (مفصولة بفواصل)</label>
                  <input id="projEq" class="form-control" />
                </div>
                <div class="col-12">
                  <label class="form-label">ملاحظة (اختياري)</label>
                  <textarea id="projNote" class="form-control" rows="2"></textarea>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button id="saveProjectBtn" class="btn btn-primary" type="submit">حفظ</button>
              <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">إلغاء</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Delete confirmation modal -->
    <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">تأكيد الحذف</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="إغلاق"></button>
          </div>
          <div class="modal-body">
            <p id="deleteMsg">هل تريد حذف المشروع؟</p>
          </div>
          <div class="modal-footer">
            <button id="confirmDeleteBtn" class="btn btn-danger">حذف</button>
            <button class="btn btn-outline-secondary" data-bs-dismiss="modal">إلغاء</button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/saas.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
